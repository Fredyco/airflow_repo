# docker-compose.yml = CARA MENJALANKAN container (port, folder, password, dll).

services:                         # daftar container yang dijalankan

  airflow:                        # nama container
    build: .                      # buat image dari Dockerfile di folder ini
    ports:
      - "8080:8080"               # laptop:container -> buka localhost:8080 di browser
    volumes:
      - ../workspace:/workspace   # laptop:container -> folder di laptop muncul di container
    env_file: ../.env             # password dibaca dari file .env (tidak ditulis di sini)

  postgres:                       # container kedua
    image: postgres:17            # pakai image jadi dari Docker Hub, tanpa Dockerfile
    ports:
      - "5433:5432"               # laptop 5433 -> container 5432 (5432 di laptop sudah dipakai)
    environment:
      POSTGRES_PASSWORD: postgres # setting langsung di sini (khusus contoh)
