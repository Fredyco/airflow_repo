name: de-lab

services:
  # Tempat kerja: Jupyter (8888) + Airflow (8080) + Spark
  lab:
    build: .
    image: de-lab:py313
    env_file:
      - path: .env              # PG_* (PostgreSQL di laptop), MONGO_URI, SERVICES
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    ports:
      - "8888:8888"   # JupyterLab
      - "8080:8080"   # Airflow
      - "4040:4040"   # Spark UI
    volumes:
      - ./workspace:/workspace  # folder workspace di laptop = /workspace di container
      - airflow-logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # supaya bisa connect ke PostgreSQL di laptop
    depends_on:
      airflow-db:
        condition: service_healthy
    mem_limit: 3g
    restart: unless-stopped

  # Database internal Airflow (riwayat run, status task). Tidak dipakai untuk data tugas.
  airflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs:
